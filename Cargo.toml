[workspace]
members = ["crates/txsignx-core", "crates/txsignx-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
repository = "https://github.com/j-kon/txsignx"

[workspace.dependencies]
bitcoin = { version = "0.32.102", default-features = false, features = ["std", "base64"] }
clap = { version = "4.6.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0.20"
txsignx-core = { path = "crates/txsignx-core" }
