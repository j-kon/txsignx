[package]
name = "txsignx-api"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio", "ws"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time", "signal"] }
bitcoin.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
txsignx-core.workspace = true
txsignx-wallet.workspace = true
txsignx-node.workspace = true
txsignx-policy.workspace = true
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

